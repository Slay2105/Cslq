name: Build iOS Dylib

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Compile arm64 Dylib
        run: |
          xcrun -sdk iphoneos clang -arch arm64 -dynamiclib \
            -fobjc-arc -Wno-deprecated-declarations \
            -miphoneos-version-min=14.0 \
            -framework UIKit -framework Foundation -framework WebKit -framework CoreGraphics -framework QuartzCore \
            -install_name @rpath/AOVAutoClick.dylib \
            Tweak.m -o AOVAutoClick.dylib

      - name: Upload Dylib Artifact
        uses: actions/upload-artifact@v4
        with:
          name: AOVAutoClick-dylib
          path: AOVAutoClick.dylib
