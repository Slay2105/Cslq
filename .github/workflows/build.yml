name: Build Native 3D Track Dylib

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build-dylib:
    runs-on: macos-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Disassemble XREFs to TrackAll & cwTrackSettings (C++ Analyzer)
        run: |
          if [ -f "VirtualPool4iPhone" ]; then
            cat << 'EOF' > analyze.cpp
          #include <iostream>
          #include <fstream>
          #include <vector>
          #include <string>
          #include <cstdint>
          #include <cstring>
          #include <set>
          #include <map>
          #include <cstdlib>

          struct TargetStr {
              const char* name;
              uint64_t offset;
          };

          void find_code_xrefs(const std::vector<uint8_t>& data, uint64_t text_start, uint64_t text_end,
                               const std::map<uint64_t, std::string>& targets, std::set<uint64_t>& out_funcs) {
              std::set<uint64_t> pages;
              for (auto& kv : targets) pages.insert((0x100000000ULL + kv.first) & ~0xfffULL);

              for (uint64_t off = text_start; off + 32 < text_end; off += 4) {
                  uint32_t insn1 = *(const uint32_t*)(&data[off]);
                  if ((insn1 & 0x9f000000) == 0x90000000) { // ADRP
                      uint32_t rd = insn1 & 0x1f;
                      int64_t immlo = (insn1 >> 29) & 0x3;
                      int64_t immhi = (insn1 >> 5) & 0x7ffff;
                      int64_t imm = (immhi << 2) | immlo;
                      if (imm & (1LL << 20)) imm -= (1LL << 21);
                      uint64_t pc_page = (0x100000000ULL + off) & ~0xfffULL;
                      uint64_t target_page = pc_page + (imm << 12);

                      if (pages.count(target_page)) {
                          for (int k = 1; k <= 8; k++) {
                              uint32_t insn2 = *(const uint32_t*)(&data[off + k * 4]);
                              uint32_t rn = (insn2 >> 5) & 0x1f;
                              if (rn != rd) continue;

                              uint64_t full_vma = 0;
                              if ((insn2 & 0xff800000) == 0x91000000) { // ADD Xd, Xn, #imm12
                                  uint64_t imm12 = (insn2 >> 10) & 0xfff;
                                  if ((insn2 >> 22) & 1) imm12 <<= 12;
                                  full_vma = target_page + imm12;
                              } else if ((insn2 & 0xffc00000) == 0xf9400000) { // LDR Xd, [Xn, #imm12*8]
                                  uint64_t imm12 = ((insn2 >> 10) & 0xfff) * 8;
                                  full_vma = target_page + imm12;
                              }
                              if (full_vma >= 0x100000000ULL) {
                                  uint64_t target_off = full_vma - 0x100000000ULL;
                                  auto it = targets.find(target_off);
                                  if (it != targets.end()) {
                                      uint64_t code_vma = 0x100000000ULL + off;
                                      printf("Code @ 0x%09llx -> refs [%s] (0x%09llx)\n",
                                             code_vma, it->second.c_str(), full_vma);
                                      out_funcs.insert(code_vma);
                                  }
                              }
                          }
                      }
                  }
              }
          }

          int main() {
              std::ifstream f("VirtualPool4iPhone", std::ios::binary);
              if (!f) return 0;
              std::vector<uint8_t> data((std::istreambuf_iterator<char>(f)), std::istreambuf_iterator<char>());

              std::vector<std::string> keywords = {
                  "15cwTrackSettings", "10CareerPlay", "12cwCareerPlay", "15cwCareerManager",
                  "No AimAids", "AimLine", "TrackAll", "Track Type", "Track AimLine",
                  "Track CueBall", "Restrict Aim Eyepoint", "CareerCash1500",
                  "icons/TrackingLines_Icon.tga", "icons/TrackingPaths_Icon.tga",
                  "icons/TrackingGhostBalls_Icon.tga", "icons/TrackingGhostPath_Icon.tga"
              };

              std::map<uint64_t, std::string> target_offsets;
              printf("=== 1. STRING OFFSETS ===\n");
              for (const auto& kw : keywords) {
                  for (size_t i = 0; i + kw.size() < data.size(); i++) {
                      if (memcmp(&data[i], kw.data(), kw.size()) == 0) {
                          if (i == 0 || data[i-1] == 0 || kw[0] == '1') {
                              target_offsets[i] = kw;
                              printf("0x%09llx : %s\n", 0x100000000ULL + i, kw.c_str());
                          }
                      }
                  }
              }

              printf("\n=== 2. DATA POINTERS & VTABLE (CHAINED FIXUPS AWARE) ===\n");
              std::map<uint64_t, std::string> data_ptrs;
              for (uint64_t pos = 0x00fb0000; pos + 8 <= data.size(); pos += 8) {
                  uint64_t val = *(const uint64_t*)(&data[pos]);
                  uint64_t low28 = val & 0x0fffffffULL;
                  auto it = target_offsets.find(low28);
                  if (it != target_offsets.end()) {
                      printf("DataPtr @ 0x%09llx (raw 0x%016llx) -> '%s'\n",
                             0x100000000ULL + pos, val, it->second.c_str());
                      data_ptrs[pos] = "PtrTo_" + it->second;
                      for (int d = -16; d <= 16; d += 8) {
                          if (pos + d > 0) data_ptrs[pos + d] = "StructNear_" + it->second;
                      }
                      // Nếu là RTTI name (15cwTrackSettings...), tìm TypeInfo (pos - 8) và VTable
                      if (it->second[0] == '1') {
                          uint64_t ti_off = pos - 8;
                          for (uint64_t p2 = 0x00fb0000; p2 + 64 <= data.size(); p2 += 8) {
                              uint64_t v2 = *(const uint64_t*)(&data[p2]);
                              if ((v2 & 0x0fffffffULL) == ti_off) {
                                  uint64_t vtable_off = p2 + 8;
                                  printf("  [VTABLE] %s @ 0x%09llx (vptr target):\n",
                                         it->second.c_str(), 0x100000000ULL + vtable_off);
                                  data_ptrs[vtable_off] = "VTable_" + it->second;
                                  data_ptrs[p2 - 8] = "VTableHeader_" + it->second;
                                  for (int m = 0; m < 10; m++) {
                                      uint64_t fn = *(const uint64_t*)(&data[vtable_off + m * 8]);
                                      uint64_t fn_off = fn & 0x0fffffffULL;
                                      if (fn_off >= 0x4000 && fn_off < 0xbb5058) {
                                          printf("    vtable[%d] = 0x%09llx\n", m, 0x100000000ULL + fn_off);
                                      }
                                  }
                              }
                          }
                      }
                  }
              }

              printf("\n=== 3. CODE XREFS IN __TEXT ===\n");
              std::set<uint64_t> funcs_to_dump;
              std::map<uint64_t, std::string> all_targets = target_offsets;
              for (auto& kv : data_ptrs) all_targets[kv.first] = kv.second;

              find_code_xrefs(data, 0x00004000, 0x00bb5058, all_targets, funcs_to_dump);
              fflush(stdout);

              printf("\n=== 4. DISASSEMBLY OF MATCHED FUNCTIONS ===\n");
              fflush(stdout);
              std::set<uint64_t> dumped_windows;
              int count = 0;
              for (uint64_t addr : funcs_to_dump) {
                  uint64_t win = addr & ~0x7fULL;
                  if (dumped_windows.count(win)) continue;
                  dumped_windows.insert(win);
                  if (++count > 25) break;
                  uint64_t s = addr - 0x80;
                  uint64_t e = addr + 0x140;
                  char cmd[512];
                  snprintf(cmd, sizeof(cmd),
                           "xcrun llvm-objdump -d --start-address=0x%llx --stop-address=0x%llx VirtualPool4iPhone",
                           s, e);
                  printf("\n--- Dump around 0x%09llx ---\n", addr);
                  fflush(stdout);
                  system(cmd);
              }
              return 0;
          }
          EOF
            clang++ -std=c++17 -O2 analyze.cpp -o analyze
            ./analyze > Offsets_Report.txt
          else
            echo "VirtualPool4iPhone binary not found" > Offsets_Report.txt
          fi

      - name: Compile PoolModMenu.dylib (arm64)
        run: |
          SDK_PATH=$(xcrun --sdk iphoneos --show-sdk-path)
          clang++ -arch arm64 \
            -dynamiclib \
            -isysroot "$SDK_PATH" \
            -miphoneos-version-min=14.0 \
            -fobjc-arc \
            -O2 \
            -framework UIKit \
            -framework Foundation \
            -framework QuartzCore \
            -framework CoreGraphics \
            PoolModMenu.mm \
            -o PoolModMenu.dylib
          ldid -S PoolModMenu.dylib || true

      - name: Upload Compiled Dylib & Offset Report
        uses: actions/upload-artifact@v4
        with:
          name: PoolModMenu-Dylib
          path: |
            PoolModMenu.dylib
            Offsets_Report.txt
