name: Build Native 3D Track Dylib

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build-dylib:
    runs-on: macos-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Locate cwTrackSettings & TrackAll Offsets
        run: |
          if [ -f "VirtualPool4iPhone" ]; then
            chmod +x VirtualPool4iPhone
            python3 - << 'EOF' > Offsets_Report.txt
          import subprocess, re

          with open("VirtualPool4iPhone", "rb") as f:
              data = f.read()

          targets = [
              b"15cwTrackSettings",
              b"No AimAids\x00",
              b"AimLine\x00",
              b"TrackAll\x00",
              b"Track Type\x00",
              b"Track AimLine\x00",
              b"Track CueBall\x00",
              b"Restrict Aim Eyepoint\x00",
              b"CareerCash1500\x00"
          ]

          print("=== EXACT FILE OFFSETS OF TRACK STRINGS ===")
          for t in targets:
              idx = 0
              while True:
                  pos = data.find(t, idx)
                  if pos == -1: break
                  print(f"{t.decode('latin1').strip(chr(0)):25s} -> File Offset: 0x{pos:08x} (VMAddr ~ 0x{0x100000000 + pos:09x})")
                  idx = pos + 1
          EOF
            echo "=== SECTION HEADERS ===" >> Offsets_Report.txt
            otool -l VirtualPool4iPhone | grep -A 5 -E "sectname (__text|__cstring|__const|__data|__bss)" >> Offsets_Report.txt || true
          fi

      - name: Compile PoolModMenu.dylib (arm64)
        run: |
          SDK_PATH=$(xcrun --sdk iphoneos --show-sdk-path)
          clang++ -arch arm64 \
            -dynamiclib \
            -isysroot "$SDK_PATH" \
            -miphoneos-version-min=14.0 \
            -fobjc-arc \
            -O2 \
            -framework UIKit \
            -framework Foundation \
            -framework QuartzCore \
            -framework CoreGraphics \
            PoolModMenu.mm \
            -o PoolModMenu.dylib
          ldid -S PoolModMenu.dylib || true

      - name: Upload Compiled Dylib & Offset Report
        uses: actions/upload-artifact@v4
        with:
          name: PoolModMenu-Dylib
          path: |
            PoolModMenu.dylib
            Offsets_Report.txt
