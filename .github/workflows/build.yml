name: Build Native 3D Track Dylib

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build-dylib:
    runs-on: macos-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Dump SetAimAids (0x1001112b8) & GetAimFlag (0x10017bdc8)
        run: |
          if [ -f "VirtualPool4iPhone" ]; then
            xcrun llvm-objdump -d --start-address=0x1001112b8 --stop-address=0x100111450 VirtualPool4iPhone > Offsets_Report.txt || true
            xcrun llvm-objdump -d --start-address=0x10017bdc8 --stop-address=0x10017bf00 VirtualPool4iPhone >> Offsets_Report.txt || true
          else
            echo "Build Dylib Only" > Offsets_Report.txt
          fi

      - name: Compile PoolModMenu.dylib (arm64)
        run: |
          SDK_PATH=$(xcrun --sdk iphoneos --show-sdk-path)
          clang++ -arch arm64 \
            -dynamiclib \
            -isysroot "$SDK_PATH" \
            -miphoneos-version-min=14.0 \
            -fobjc-arc \
            -O2 \
            -framework UIKit \
            -framework Foundation \
            -framework QuartzCore \
            -framework CoreGraphics \
            PoolModMenu.mm \
            -o PoolModMenu.dylib
          ldid -S PoolModMenu.dylib || true

      - name: Upload Compiled Dylib & Offset Report
        uses: actions/upload-artifact@v4
        with:
          name: PoolModMenu-Dylib
          path: |
            PoolModMenu.dylib
            Offsets_Report.txt
